[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "primarysource"
dynamic = ["version"]
description = "Shared core for citable document libraries: sectioned-document model, ref grammar, token-budgeted paging, and (planned) readers, a full-text index, a CLI and an MCP server."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Justin Capella" }]
keywords = ["documents", "citation", "full-text-search", "mcp", "model-context-protocol", "standards"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
# The core that exists today is standard library only. Readers that need a dependency (pypdf) arrive as extras
# with the reader, not before it.
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.20", "pytest>=8", "ruff>=0.15"]
# posix and ieee802 (primarysource/ieee/). pypdf is for importing 802 PDFs only; posix needs nothing.
ieee = ["pypdf>=5"]
iana = []
cavp = []
usbids = []
draft = []
c2sp = []
bbf = ["pypdf>=5"]
ecma = ["pypdf>=5"]
gitdocs = []
debpolicy = []
rpmdocs = []
pms = []
pep = []
kconfig = []

# The RFC series (primarysource/rfc/, moved in from rfclib). mcp serves any collection.
rfc = ["httpx>=0.27", "typer>=0.12", "rich>=13"]
rfc-semantic = ["primarysource[rfc]", "model2vec>=0.3", "sqlite-vec"]
rfc-zim = ["primarysource[rfc]", "libzim>=3.7"]
mcp = ["mcp>=2"]
# nist and usb (moved in from nistlib and usblib) need only the core to fetch and index; `pdftotext`
# (poppler-utils) must be on PATH to extract PDFs. Serving them needs [mcp].
nist = []
usb = []
# ITU-T recommendations (primarysource/itu/, moved in from itulib): pypdf extracts the user-fetched PDFs.
itu = ["pypdf>=5"]
# ISO standards from the owner's own purchased PDFs (primarysource/iso/): pypdf reads them at import only.
iso = ["pypdf>=5"]
# CVE records (primarysource/cve/, moved in from cvelib): standard library only; `[cve,mcp]` serves it.
cve = []

[project.scripts]
primarysource = "primarysource.cli:main"

[tool.hatch.version]
path = "primarysource/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["primarysource"]
exclude = ["**/__pycache__"]

[tool.ruff]
line-length = 118
target-version = "py312"
# Moved in from rfclib with its own style; brought under these rules separately (ROADMAP cl.adopt_rfclib).
extend-exclude = [
    "primarysource/rfc", "tests/rfc", "scripts/rfc_*.py",
    "primarysource/nist", "tests/nist", "primarysource/usb", "tests/usb", "scripts/usb_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# cve builds git and network requests from fixed URLs it names itself (moved in from cvelib with these ignores).
"primarysource/cve/*" = ["S603", "S607", "S310"]
"tests/cve/*" = ["S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["^primarysource/(rfc|nist|usb)/", "^tests/(rfc|nist|usb)/"]

[[tool.mypy.overrides]]
module = [
    "primarysource.rfc", "primarysource.rfc.*", "primarysource.nist.*", "primarysource.usb.*", "mcp", "mcp.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
