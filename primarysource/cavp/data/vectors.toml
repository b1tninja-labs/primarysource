# Vector sets `primarysource cavp fetch` may download. Each entry pins the sha256 of the artifact it downloads (the
# zip, or the ACVP prompt.json), measured 2026-11-13. No vector data is stored in this repository.
#
# CAVP zips are the ones CSRC lists on its "Digital Signatures" CAVP page for FIPS 186-4; the RSA zip is named
# 186-3 upstream and holds the FIPS 186-4 RSA SigVer response files. ACVP files are pinned to a commit of
# usnistgov/ACVP-Server (master at 2026-08-12), never to a branch.

