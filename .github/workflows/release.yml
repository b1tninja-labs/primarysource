name: release

# Tag vX.Y.Z (matching primarysource/__init__.py __version__) -> build, test the built wheel, publish to PyPI.
# "Run workflow" by hand -> TestPyPI. Publishing uses PyPI trusted publishing (OIDC, no API tokens).
# One-time setup on pypi.org / test.pypi.org: add a (pending) trusted publisher for owner b1tninja-labs,
# repository primarysource, workflow "release.yml", environment "pypi" / "testpypi".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('primarysource/__init__.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - name: Full suite from the checkout (several tests read pyproject.toml, ROADMAP.md and .gitignore)
        run: uv sync --extra dev --extra rfc --extra mcp --extra itu --extra ieee --extra ecma --extra bbf && uv run pytest -q
      - run: uv build
      - name: Smoke-test the built wheel, not the checkout
        run: |
          uv venv /tmp/wheeltest
          uv pip install --python /tmp/wheeltest "$(ls dist/*.whl)[rfc,mcp,itu]"
          cd /tmp && /tmp/wheeltest/bin/python -I -c "import primarysource, primarysource.rfc, primarysource.nist.collection; print(primarysource.__version__)"
          /tmp/wheeltest/bin/primarysource collections
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
